apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: behovsakkumulator
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: /isalive
  readiness:
    path: /isready
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  valkey:
    - instance: behovsakkumulator
      access: readwrite
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-behovsakkumulator-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
